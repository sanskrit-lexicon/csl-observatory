name: Refresh data snapshot (legacy pipeline)

# The canonical scheduled refresh is refresh-observatory.yml, which feeds the
# dashboard + findings. This older pull_data/compute_metrics/render_reports
# pipeline is kept for the legacy report tables (data/summary.json, the
# README/STATUS headline numbers). Its schedule was removed at some point
# between the 2026-05-07 bootstrap and 2026-06-01 to avoid two crons racing
# to commit data/ (no removal commit/PR found in git history — the file was
# never touched again after the initial `git log -S cron` hit, so the
# schedule block itself was deleted by hand outside a tracked commit).
# Restored 24-09-2026 (H5424, MG ruling: "I don't know why the cron was
# removed, bring it back, is still show it, no need to freeze") at an offset
# from refresh-observatory.yml's Monday 03:00 UTC slot; the shared
# concurrency group below queues instead of racing either way.

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC — 3h after refresh-observatory.yml
  workflow_dispatch:

permissions:
  contents: write
  # pull-requests: write — the snapshot commit ships through a bot branch + PR
  # (main is protected since ~12-10-2026; a direct `git push` to main gets
  # GH006 and has killed every scheduled run since). Same shape as
  # refresh-observatory.yml's proven commit step.
  pull-requests: write

concurrency:
  # Shared with refresh-observatory.yml: both pipelines commit data/, so they
  # must not run concurrently. Queue rather than cancel.
  group: observatory-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # lfs: true so no job can ever read an un-smudged pointer stub as data
      # (issue #127 — the data catalog published 133-byte pointers as dataset sizes).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'

      - name: Pull data
        env:
          # Org-project access needs a PAT: the default GITHUB_TOKEN cannot
          # read org-level projectV2 items ("Resource not accessible by
          # integration"), which silently zeroed total_project_board_items in
          # every snapshot since 2026-09-24. Same PAT contract as
          # tooling-audit.yml: read:project + repo scopes, stored as the
          # TOOLING_AUDIT_TOKEN repo secret.
          GH_TOKEN: ${{ secrets.TOOLING_AUDIT_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::TOOLING_AUDIT_TOKEN secret not set. Add a PAT with read:project + repo scopes (same contract as tooling-audit.yml)."
            exit 1
          fi
          python scripts/pull_data.py
          # Recover commit history for large repos the GraphQL endpoint can't
          # serve (csl-orig, cologne-stardict, VCP, hwnorm1, ...) via a bare
          # blob:none clone, before compute_metrics.py reads data/commits.json.
          python scripts/retry_via_clone.py
          python scripts/compute_metrics.py
          python scripts/render_reports.py
          python scripts/update_headline_numbers.py
          # H7122: the numbers just written must re-derive from their snapshots
          # before anything is committed. A red step here blocks the refresh commit.
          python scripts/update_headline_numbers.py --check

      - name: Commit if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # docs/ANTHOLOGY_ALIGNMENT_2026Q4.md is requoted by
          # update_headline_numbers.py's requote_live_claims() (H7879): the
          # 2026-11-18 snapshot PR #335 omitted it from this list, so the PR
          # carried a stale live row past the in-run --check (which sees the
          # runner's working tree) and reddened the PR-side headline gate.
          git add data reports README.md STATUS.md docs/ANTHOLOGY_ALIGNMENT_2026Q4.md
          # Fail loudly if the pipeline dirtied any OTHER tracked file: a
          # requoted surface that ships outside this list is exactly the #335
          # red-merge failure mode, and silence here means a stale surface on
          # main that only the next human PR discovers.
          if ! git diff --quiet; then
            echo "::error::refresh left unshipped tracked changes:"
            git diff --name-only
            exit 1
          fi
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "data: weekly snapshot $(date +%Y-%m-%d)"
            # main is protected (GH006 on every scheduled run since
            # 2026-10-12): ship the snapshot through a bot-owned branch and a
            # PR that auto-merges once required checks pass — the same flow
            # refresh-observatory.yml has used green since 2026-11-08 (#309).
            BRANCH="bot/legacy-live-snapshot"
            git push -f origin "HEAD:$BRANCH"
            gh pr create --head "$BRANCH" --base main \
              --title "data: weekly snapshot $(date +%Y-%m-%d)" \
              --body "Automated live-API snapshot (legacy refresh.yml pipeline, H7879). Auto-merges when required checks pass." 2>/dev/null || true
            gh pr merge "$BRANCH" --squash --auto
            # No force-merge fallback: main requires headline-claims + smoke
            # + paper-priv-guard (YJG, MG 21-11-2026) — a red or check-pending
            # snapshot PR must never merge; if --auto errors, fail loudly.
          fi
