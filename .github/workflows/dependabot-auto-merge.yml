name: Dependabot auto-merge

# Hands-off merge of non-major Dependabot pull requests after this workflow's
# validation job passes. Major bumps are intentionally left for human review.
# Deployed by /cologne-dependabot-automerge-all.

on: pull_request

permissions:
  contents: read

jobs:
  validate:
    name: Validate Dependabot PR
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    permissions:
      contents: read
    steps:
      # lfs: true so no job can ever read an un-smudged pointer stub as data
      # (issue #127 — the data catalog published 133-byte pointers as dataset sizes).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Compile Python
        run: python -m compileall -q scripts observatory

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '20'

      - name: Install site dependencies
        working-directory: observatory/site
        run: npm ci

      - name: Build site
        working-directory: observatory/site
        run: npm run build

  dependabot:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ github.actor == 'dependabot[bot]' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Approve the PR
        if: ${{ steps.meta.outputs.update-type != 'version-update:semver-major' }}
        run: gh pr review --approve "$PR_URL" || true
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: ${{ steps.meta.outputs.update-type != 'version-update:semver-major' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Hold major update for review
        if: ${{ steps.meta.outputs.update-type == 'version-update:semver-major' }}
        run: echo "Semver-major Dependabot update held for human review."
