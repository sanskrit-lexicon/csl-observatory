name: Project sync (milestone → project board)

# One-off repair lane for the taxonomy audit's project axis (dict_runbook.py
# gaps(): an issue whose milestone maps to a project must BE a member of that
# project). The nightly agent's gh token lacks read:project, so the membership
# side can only be repaired from CI. ADDITIONS ONLY — this never removes a
# board item; board pruning stays a human action.

on:
  workflow_dispatch:

permissions:
  contents: read
  repository-projects: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Add milestone-mapped missing project items (dictionaries)
        env:
          # Required: PAT with project access. The default GITHUB_TOKEN
          # cannot see org-level projectV2 at all (run 38084475884:
          # "Could not resolve to a ProjectV2 with the number 1" under
          # organization(), while an admin token resolves it fine) —
          # same reason dict-audit/tooling-audit use this secret. The PAT
          # must carry write access for addProjectV2ItemById.
          GH_TOKEN: ${{ secrets.TOOLING_AUDIT_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::TOOLING_AUDIT_TOKEN secret not set. Add a PAT with project (read+write) + repo scopes."
            exit 1
          fi
          python - <<'PY'
          import sys, json, subprocess
          sys.stdout.reconfigure(encoding='utf-8')

          ORG = "sanskrit-lexicon"
          PROJ = {"Dictionary to Book": 1, "Digitization Quality": 2,
                  "Structured Data": 3, "Major Enhancements": 4}
          REPOS = ["ACC","AMAR","AP","AP90","ApteES","BEN","BHS","BOP","BOR","BUR",
                   "CAE","CCS","DCS","FRI","GRA","INM","KNA","KOW","KRM","LRV","MCI",
                   "MD","MWS","PUI","PWG","PWK","SCH","SHS","SKD","STC","VCP","VEI",
                   "WIL","Wil-YAT"]
          EXEMPT = {"daily-corrections"}

          def gh_json(args):
              r = subprocess.run(["gh"] + args, capture_output=True, text=True)
              if r.returncode != 0:
                  raise SystemExit(f"gh {args[0]} failed: {r.stderr[:300]}")
              return json.loads(r.stdout)

          # project ids — the dictionary boards #1-4 are ORG projects
          # (sanskrit-lexicon), verified 10-10-2026: issue projectItems on
          # PWG/MWS reference org boards #1-4 ("Dictionary to Book" #1,
          # "Digitization Quality" #2, "Structured Data" #3, "Major
          # Enhancements" #4; a parallel #5-8 set serves the tooling repos).
          # The original "they are USER (gasyoun) projects" read was an
          # artifact of the nightly agent's token lacking read:project — its
          # org listing came back empty. gasyoun's real user boards are
          # unrelated (BookIndex backlog #1, Handoffs Kanban #2), and a repo
          # GITHUB_TOKEN cannot see the private one anyway, which is what
          # killed every run at "Could not resolve to a ProjectV2 with the
          # number 2" (run 37099088210 et al.).
          proj_id = {}
          for num in sorted(set(PROJ.values())):
              q = '{organization(login:"%s"){projectV2(number:%d){id number}}}' % (ORG, num)
              node = gh_json(["api", "graphql", "-f", f"query={q}"]).get(
                  "data", {}).get("organization", {}).get("projectV2")
              if node:
                  proj_id[node["number"]] = node["id"]
          if set(PROJ.values()) - set(proj_id):
              raise SystemExit(f"projects not found (org {ORG}): {sorted(set(PROJ.values()) - set(proj_id))}")

          added = skipped = 0
          for repo in REPOS:
              cur = None
              while True:
                  after = f', after:"{cur}"' if cur else ""
                  q = ('query($o:String!,$n:String!,$c:String){repository(owner:$o,name:$n){'
                       'issues(first:100,after:$c,states:[OPEN]){pageInfo{hasNextPage endCursor}'
                       'nodes{number labels(first:30){nodes{name}} milestone{title}'
                       ' projectItems(first:10){nodes{project{number}}}}}}}')
                  d = gh_json(["api", "graphql", "-f", f"query={q}",
                               "-f", f"o={ORG}", "-f", f"n={repo}", "-f", f"c={cur or ''}"])
                  conn = d["data"]["repository"]["issues"]
                  for x in conn["nodes"]:
                      lbls = {l["name"] for l in x["labels"]["nodes"]}
                      if lbls & EXEMPT or (lbls and lbls <= {"handoff"}):
                          continue
                      ms = (x["milestone"] or {}).get("title")
                      tgt = PROJ.get(ms)
                      if not tgt:
                          continue
                      if tgt in [p["project"]["number"] for p in x["projectItems"]["nodes"]]:
                          skipped += 1
                          continue
                      iid = gh_json(["api", "graphql", "-f",
                          f'query={{repository(owner:"{ORG}",name:"{repo}"){{issue(number:{x["number"]}){{id}}}}}}']
                      )["data"]["repository"]["issue"]["id"]
                      gh_json(["api", "graphql", "-f",
                          f'mutation{{addProjectV2ItemById(input:{{projectId:"{proj_id[tgt]}",contentId:"{iid}"}}){{item{{id}}}}}}'])
                      added += 1
                      print(f"+ {repo}#{x['number']} -> project {tgt}")
                  if conn["pageInfo"]["hasNextPage"]:
                      cur = conn["pageInfo"]["endCursor"]
                  else:
                      break
          print(f"added={added} already-members={skipped}")
          PY
      - name: Report
        if: always()
        run: echo "Re-run the Dictionary taxonomy audit to verify the project axis."
